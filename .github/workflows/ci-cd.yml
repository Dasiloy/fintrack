# =============================================================================
# FinTrack — CI / CD Pipeline
#
# Triggers & job matrix:
#   • push any branch except main  → quality (type-check) + test
#   • push main (merge)            → migrate (prisma migrate deploy → prod DB)
#                                    then Railway auto-deploys via Git integration
#
# Database strategy:
#   Dev  DB → DATABASE_URL in .env (local) / placeholder in quality+test jobs
#   Prod DB → PROD_DATABASE_URL + PROD_DATABASE_CA_CERTIFICATE GitHub secrets
#
# Migration ordering:
#   The migrate job runs on main push in parallel with Railway's auto-deploy.
#   All migrations MUST be backwards-compatible (additive only — no column
#   drops or type changes that break running code). This ensures the race
#   between migration and deploy is always safe. For destructive migrations,
#   use a two-release strategy: deprecate in release N, drop in release N+1.
# =============================================================================

name: CI / CD

on:
  push:
    branches: ['**']

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.0.0'

# ── Job 1: Type Check ─────────────────────────────────────────────────────────
jobs:
  quality:
    name: Type Check
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build shared packages so workspace imports resolve during type-check.
      # DATABASE_URL is a placeholder — prisma generate reads schema only, no DB connection.
      - name: Build workspace packages
        run: pnpm turbo build --filter="./packages/*"
        env:
          SKIP_ENV_VALIDATION: 'true'
          DATABASE_URL: 'postgresql://user:pass@localhost/db'
          DATABASE_CA_CERTIFICATE: 'your-database-ca-certificate-in-base64'

      - name: Type check all apps
        run: pnpm check-types
        env:
          SKIP_ENV_VALIDATION: 'true'

  # ── Job 2: Unit Tests (one job per NestJS service) ────────────────────────────
  test:
    name: Test — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref != 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        service:
          - api_gateway
          - auth_service
          - notification_service
          - payment_service

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm turbo build --filter="./packages/*"
        env:
          SKIP_ENV_VALIDATION: 'true'
          DATABASE_URL: 'postgresql://user:pass@localhost/db'
          DATABASE_CA_CERTIFICATE: 'your-database-ca-certificate-in-base64'

      - name: Run tests
        run: pnpm --filter ${{ matrix.service }} test
        env:
          NODE_ENV: test

  # ── Job 3: Production Database Migration ──────────────────────────────────────
  # Runs ONLY on merge to main. Applies any pending Prisma migrations to the
  # production database using `prisma migrate deploy` (never creates new
  # migrations — that's what `migrate dev` is for locally).
  #
  # Secrets required in GitHub repo settings:
  #   PROD_DATABASE_URL             — production Postgres connection string
  #   PROD_DATABASE_CA_CERTIFICATE  — base64-encoded CA cert (same format as dev)
  migrate:
    name: Migrate — Production DB
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the database package so prisma.config.ts is resolved correctly.
      - name: Build database package
        run: pnpm turbo build --filter=@fintrack/database
        env:
          SKIP_ENV_VALIDATION: 'true'
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DATABASE_CA_CERTIFICATE: ${{ secrets.PROD_DATABASE_CA_CERTIFICATE }}

      - name: Apply migrations to production
        run: pnpm --filter @fintrack/database db:deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DATABASE_CA_CERTIFICATE: ${{ secrets.PROD_DATABASE_CA_CERTIFICATE }}
