syntax = "proto3";

package finance;

import "paginate.proto";

enum TransactionType {
  INCOME  = 0;
  EXPENSE = 1;
}

enum TransactionSource {
  MANUAL    = 0;
  BANK      = 1;
  RECURRING = 2;
  OCR       = 3;
  SPLIT     = 4;
}

message Empty {}

message Category {
  string name  = 1;
  string slug  = 2;
  string color = 3;
  string icon  = 4;
}

message Bank {
  string bank_id        = 1;
  string bank_name  = 2;
  string account_number = 3;
  string account_name   = 4;
}

// Lightweight split summary embedded inside a Transaction response.
// Not the same as the full Split message defined in split.proto.
message SplitRef {
  string id     = 1;
  string name   = 2;
  string amount = 3; // string — preserves decimals
  string status = 4;
}

message GoalContribution {
  string id          = 1;
  string amount      = 2; // string — preserves decimals
  string date        = 3;
  string description = 4;
  string notes       = 5;
}

message CreateTransactionReq {
  string            amount        = 1; // string e.g. "5000.50"
  string            date          = 2; // ISO string e.g. "2026-03-20"
  TransactionType   type          = 3;
  optional string   description   = 4;
  optional string   merchant      = 5;
  string            category_slug = 6;
  TransactionSource source        = 7;
 string   source_id     = 8;
 optional string   source_data = 9;
}

message Transaction {
  string            id                       = 1;
  string            amount                   = 2; // string — preserves decimals
  string            date                     = 3;
  string           type                     = 4;
  string           source                   = 5;
  Category          category                 = 6;
  string            created_at               = 8;
  string            updated_at               = 9;
  optional string   merchant                 = 7;
  optional string   source_id                = 10;
  optional string   source_data              = 11;
  optional string   description              = 12;
  optional string   notes                    = 13;
  optional string   bank_transaction_id      = 14;
  optional string   bank_transaction_status  = 16;
  optional Bank     bank                     = 17;
  optional SplitRef split                    = 18;
  optional GoalContribution goal_contribution = 19;
}
message GetTransactionsReq {
  optional string           start_date          = 1;
  optional string           end_date            = 2;
  int32                     page                = 3;
  int32                     limit               = 4;
  repeated string           category_slug       = 5; // empty array = not filtered
  repeated TransactionType  type                = 6; // empty array = not filtered
  repeated TransactionSource source             = 7; // empty array = not filtered
  optional string           source_id           = 8;
  optional string           bank_transaction_id = 9;
  optional string           bank_account_id     = 10;
}

message GetTransactionsRes {
  repeated Transaction transactions = 1;
  PaginateResponse meta = 2;
}

message GetTransactionReq {
  string id = 1;
}

message UpdateTransactionReq {
  string id = 1;
  optional string amount = 2;
  optional string date = 3;
  optional TransactionType type = 4;
  optional string description = 5;
  optional string merchant = 6;
  optional string category_slug = 7;
  optional string notes = 8;
}

message DeleteTransactionReq {
  string id = 1;
}

// Used exclusively for bank sync batch imports.
// category_id is pre-resolved by the processor — no category lookup needed.
message BankTransactionItem {
  string            amount               = 1;
  string            date                 = 2;
  TransactionType   type                 = 3;
  optional string   description          = 4;
  string            category_id          = 5;
  string            source_id            = 6;
  TransactionSource source               = 7;
  optional string   merchant             = 8;
  optional string   mono_bank_account_id = 9;
  bool              ai_classified        = 10;
  optional string   narration            = 11;
  optional string   bank_transaction_id  = 12;
  optional string   source_data          = 13; // JSON-stringified audit blob
}

message BatchCreateTransactionsReq {
  repeated BankTransactionItem transactions         = 1;
}

message BatchCreateTransactionsRes {
  int32 created = 1;
  int32 skipped = 2;
}

// Daily expense total for a single calendar day.
message DailySpending {
  string date   = 1; // "YYYY-MM-DD"
  string amount = 2; // decimal string, expense amount only
}

// Aggregated income and expense for a single calendar month.
message MonthlyFinancials {
  string month   = 1; // "YYYY-MM"
  string income  = 2; // decimal string
  string expense = 3; // decimal string
}

message SearchTransactionsReq {
  string q     = 1; // partial text — union ILIKE across description, merchant, notes, narration
  string type  = 2; // "EXPENSE" | "INCOME" | "" (all)
  int32  limit = 3; // default 20, max 50
}

message SearchTransactionsRes {
  repeated Transaction transactions = 1;
}

message GetTransactionSummaryReq {
  optional int32 months = 1; // how many months of monthly_series to return (server caps per plan)
}

message GetTransactionSummaryRes {
  string net_balance        = 1; // all-time income - expense
  string monthly_income     = 2; // current calendar month INCOME sum
  string monthly_expense    = 3; // current calendar month EXPENSE sum
  string monthly_net        = 4; // monthly_income - monthly_expense
  double balance_change_pct = 5; // ((this_month_net - last_month_net) / |last_month_net|) * 100
  repeated DailySpending weekly_spending  = 6; // Mon-Sun this week (up to 7 items)
  repeated DailySpending spending_heatmap = 7; // last 84 days (12 weeks x 7)
  repeated MonthlyFinancials monthly_series = 8; // last N months for trend charts
}


