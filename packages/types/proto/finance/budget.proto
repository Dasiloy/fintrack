syntax = "proto3";
package finance;

import "finance/transaction.proto";

message Budget {
  string id = 1;
  string name = 2;
  float amount = 3;
  string description = 4;
  string period = 5;
  bool carry_over = 6;
  float alert_threshold = 7;
  Category category = 8;
  string created_at = 9;
  string updated_at = 10;
  string  spent     = 11;
  float alert_at_frequency = 12;
  optional string deactivated_at = 13;
}

message CreateBudgetReq {
  string name = 1;
  float amount = 2;
  optional string description = 3;
  optional float alert_threshold = 4;
  string category_slug = 5;
  optional int32 month = 6;
  optional int32 year = 7;
  optional string period = 8;
  optional float alert_at_frequency = 9;
}

message UnbudgetedCategory {
  string slug          = 1;
  string name          = 2;
  string color         = 3;
  string icon          = 4;
  float  spent         = 5;
  bool   is_user_owned = 6;
}

message GetBudgetsReq {
  int32 month = 1;  // 0-indexed
  int32 year  = 2;
}

message GetBudgetsRes {
  repeated Budget             budgets    = 1;
  repeated UnbudgetedCategory unbudgeted = 2;
}

message GetBudgetReq {
  string id = 1;
  int32  month = 2;
  int32  year  = 3;
}

message BudgetHistoryEntry {
  string          id         = 1;
  float           limit      = 2;
  string          start_date = 3;
  optional string end_date   = 4;
  string          created_at = 5;
}

message BudgetDetail {
  Budget                       budget  = 1;
  repeated BudgetHistoryEntry  history = 2;
}

message SpendingTrendCategory {
  string slug = 1;
  string name        = 2;
  string color       = 3;
  float  amount      = 4;
}

message SpendingTrendMonth {
  string label = 1;  // "Jan 2026"
  float  total = 2;  // all-category EXPENSE sum
  repeated SpendingTrendCategory by_category = 3;
}

message GetSpendingTrendReq {
  int32 months = 1;  // lookback window: 3, 6, or 12
}

message GetSpendingTrendRes {
  repeated SpendingTrendMonth data = 1;
}


message UpdateBudgetReq {
          string id = 1;
 optional string name = 2;
 optional float amount = 3;
 optional string description = 4;
optional  float alert_threshold = 5;
optional float alert_at_frequency = 6;
int32  month = 7;
int32  year  = 8;
}

message DeleteBudgetReq {
  string id = 1;
  bool   hard_delete = 2;
}

message GetArchivedBudgetsRes {
  repeated Budget budgets = 1;
}

message RestoreBudgetReq {
  string id = 1;
}

message BudgetWorkflowBatchOperation {
  string candidate_id = 1;
  string kind = 2;
  optional CreateBudgetReq create_budget = 3;
  optional UpdateBudgetReq update_budget = 4;
  optional DeleteBudgetReq delete_budget = 5;
}

message BatchBudgetWorkflowActionsReq {
  repeated BudgetWorkflowBatchOperation operations = 1;
}

message WorkflowActionCandidateResult {
  string candidate_id = 1;
  string status = 2;
  string message = 3;
}

message BatchBudgetWorkflowActionsRes {
  string status = 1;
  bool atomic = 2;
  string message = 3;
  repeated WorkflowActionCandidateResult candidate_results = 4;
}
