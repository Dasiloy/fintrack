syntax = "proto3";

package ai;

service AiService {
  rpc ClassifyTransactions (ClassifyTransactionsReq) returns (ClassifyTransactionsRes) {}

  // Streams the advisor's response for one user message as a sequence of chunks
  // (tokens plus human-in-the-loop events). Server-side streaming.
  rpc SendAdvisorMessage (AdvisorMessageReq) returns (stream AdvisorChunkRes) {}

  // Resumes a paused advisor thread after the user approves/rejects a proposed
  // action. The continuation streams through the same chunk shape as a normal
  // advisor message.
  rpc ResumeAdvisor (ResumeAdvisorReq) returns (stream AdvisorChunkRes) {}
}

message AdvisorMessageReq {
  string conversation_id = 1; // maps to the LangGraph thread_id
  string user_id = 2;
  string message = 3;
  // Data scopes the user has granted, resolved by the gateway. Gates the
  // advisor's tools and grounded prompt sections.
  repeated string granted_scopes = 4;
  repeated AdvisorAttachment attachments = 5;
}

message AdvisorAttachment {
  string url = 1;
  string public_id = 2;
  string name = 3;
  string mime_type = 4;
  int32 size_bytes = 5;
  string kind = 6;
  string extracted_text = 7;
  string format = 8;
}

message ResumeAdvisorReq {
  string conversation_id = 1; // maps to the LangGraph thread_id
  string user_id = 2;
  bool approved = 3;
  // Data scopes the user has granted, resolved by the gateway. The resumed run
  // may continue into tools, so it needs the same scoped context as a fresh turn.
  repeated string granted_scopes = 4;
}

// One streamed chunk. The type field discriminates the chunk:
//   token               - content holds a text delta
//   approval_required   - data holds the proposed action as JSON
//   permission_required - data holds the scope and reason as JSON
//   error               - content holds an error message
message AdvisorChunkRes {
  string type = 1;
  string content = 2;
  string data = 3;
}

message MonoTransaction {
 string id = 1;
 string narration =2;
 string category =3;
}


message UserCategory {
  string id =1;
  string slug =2;
  repeated string tags = 3;
  string name = 4;
}

message ClassifyTransactionsReq {
  repeated MonoTransaction transactions = 1;
  repeated UserCategory    categories = 2;
}


message ClassifyTransactionsUnit {
  string transaction_id = 1;
  string  category_id   = 2;
  string  category_slug = 3;
}

message ClassifyTransactionsRes {
  repeated ClassifyTransactionsUnit classifications = 1;
}
